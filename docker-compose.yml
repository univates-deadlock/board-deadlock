services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpro}
      POSTGRES_DB: ${POSTGRES_DB:-techpro}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-techpro}:${POSTGRES_PASSWORD:-techpro}@db:5432/${POSTGRES_DB:-techpro}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${APP_HOST:-localhost}:${API_PORT:-4000}}
      FE_BASE_URL: ${FE_BASE_URL:-http://${APP_HOST:-localhost}:${FRONTEND_PORT:-3000}}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-4000}:4000"
    networks:
      default: {}
      deadlock_edge:
        aliases:
          - techpro-api
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - api_generated:/app/generated
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${APP_HOST:-localhost}:${API_PORT:-4000}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${APP_HOST:-localhost}:${API_PORT:-4000}}
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      default: {}
      deadlock_edge:
        aliases:
          - techpro-frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  postgres_data:
  api_node_modules:
  api_generated:
  frontend_node_modules:
  frontend_next:

networks:
  deadlock_edge:
    external: true
    name: deadlock_edge