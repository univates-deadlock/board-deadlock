name: Notify central CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # Only success on the protected main branch; NEVER dispatch PR results.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'univates-deadlock/techpro-app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger private deployment after successful CI
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: univates-deadlock/techpro-app
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DISPATCH_TOKEN" ]] || {
            echo '::error::Missing DEPLOY_DISPATCH_TOKEN (selected organization secret).'
            exit 1
          }
          payload="$(jq -nc --arg repo "$SOURCE_REPOSITORY" --arg sha "$SOURCE_SHA" \
            '{event_type:"deploy-main", client_payload:{repository:$repo,sha:$sha}}')"
          status="$(curl --silent --show-error --retry 2 \
            --request POST --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            'https://api.github.com/repos/univates-deadlock/deadlock-deploy/dispatches')"
          [[ "$status" == 204 ]] || {
            echo "::error::GitHub dispatch returned HTTP $status"
            exit 1
          }
          echo "Deployment dispatched: $SOURCE_REPOSITORY at $SOURCE_SHA"
